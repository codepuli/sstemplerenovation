<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sri Subrahmanya Swamy Temple, Payyanur — Renovation Masterplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manjari:wght@100;400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F4EF;--card:#FFFFFF;--ink:#1F2421;--mute:#5B625D;--line:#DDDBD2;--stone:#8A3B22;--pond:#1E5B57;--brass:#9A6B1F;--tint:#EDEBE3;
--c1:#1E5B57;--c2:#5E8A5A;--c3:#8A3B22;--c4:#9A6B1F;--c5:#3F6A9A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171A18;--card:#202522;--ink:#EDEBE4;--mute:#A4ABA5;--line:#343A36;--stone:#E08B6A;--pond:#6FC0B8;--brass:#D9A857;--tint:#262C28;--c1:#4FA79F;--c2:#86B382;--c3:#D0704D;--c4:#C99647;--c5:#7FA6D6}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.8 "Manjari",system-ui,sans-serif;text-wrap:pretty}
body[data-lang=en]{line-height:1.6}
h1,h2,h3{font-weight:700;line-height:1.35;margin:0;text-wrap:balance}

.wrap{max-width:960px;margin:0 auto;padding:0 20px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px;border-radius:6px}
header.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
header.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px}
.brand{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:none}
.lang button,.seg button{border:0;background:none;padding:6px 14px;font-size:14px;color:var(--mute)}
.lang button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.hero{padding:44px 0 28px}
.hero h1{font-size:clamp(28px,6vw,44px)}
.hero p.lede{color:var(--mute);margin:14px 0 0;font-size:18px}
.total{margin-top:28px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 28px}
.total .big{font-size:clamp(56px,13vw,96px);line-height:1.1;font-weight:700;color:var(--stone);letter-spacing:-.02em}
.total .big small{font-size:.38em;margin-left:6px;color:var(--mute);font-weight:400}
.total .meta{color:var(--mute);font-size:15px;flex:1 1 280px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}.scenwrap{margin-top:22px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}.seglabel{color:var(--mute);font-size:16px}.walk .btn{margin:14px 0 22px;padding:8px 16px;font-size:14px}
.seg button{padding:8px 16px;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.bar-stack{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-top:26px;gap:2px}
.bar-stack i{display:block;height:100%;transition:flex-grow .35s}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px;font-size:13px;color:var(--mute)}
.legend a{color:inherit;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.legend a:hover{color:var(--ink)}
.legend b{width:10px;height:10px;border-radius:3px;display:inline-block}
.walk{padding:12px 0 8px}
.walk h2{font-size:24px}
.walk .sub{color:var(--mute);margin:6px 0 0}
ol.path{list-style:none;margin:0;padding:0;position:relative}
ol.path::before{content:"";position:absolute;left:19px;top:20px;bottom:20px;width:3px;border-radius:3px;background:linear-gradient(var(--c1),var(--c2),var(--c3),var(--c4),var(--c5))}
.stage{position:relative;padding-left:60px;margin-bottom:22px}
.node{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:17px;border:4px solid var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card>button.head{all:unset;box-sizing:border-box;display:flex;width:100%;justify-content:space-between;align-items:flex-start;gap:14px;padding:18px 20px;cursor:pointer}
.card>button.head:focus-visible{outline:3px solid var(--brass);outline-offset:-3px}
.head h3{font-size:21px}
.head .where{color:var(--mute);font-size:14px;margin-top:2px}
.head .amt{text-align:right;flex:none}
.amt strong{font-size:26px;font-weight:700;display:block;line-height:1.2}
.amt span{font-size:12px;color:var(--mute)}
.chev{display:inline-block;transition:transform .2s;margin-left:4px}
.stage[data-open=true] .chev{transform:rotate(180deg)}
.items{display:none;border-top:1px solid var(--line)}
.stage[data-open=true] .items{display:block}
.item{display:flex;gap:14px;padding:16px 20px;border-bottom:1px solid var(--line)}.ibox{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--tint);flex:none}.ic{width:22px;height:22px}.body{flex:1;min-width:0}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.item h4{margin:0;font-size:16px;font-weight:600}
.item .v{font-weight:700;font-size:16px;white-space:nowrap;color:var(--stone)}
.item p{margin:4px 0 0;color:var(--mute);font-size:15px}
.item .share{height:5px;background:var(--tint);border-radius:3px;margin-top:10px}
.item .share i{display:block;height:100%;border-radius:3px}
.tag{display:inline-block;margin-top:8px;font-size:13px;padding:2px 10px;border-radius:999px;background:var(--tint);color:var(--mute)}
.about{margin:36px 0 0;padding:22px;border:1px dashed var(--line);border-radius:16px}
.about h2{font-size:21px}
.about p{margin:8px 0 0;color:var(--mute)}
.about ul{margin:12px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.about li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:8px;font-size:15px}
.about li span:last-child{color:var(--mute)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:500;font-size:15px;text-decoration:none}
.btn.alt{background:none;color:var(--ink);border-color:var(--line)}
footer{padding:32px 0 48px;color:var(--mute);font-size:13px}
.toast{min-height:20px;font-size:14px;color:var(--pond);margin-top:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.stage{padding-left:52px}.node{width:34px;height:34px;font-size:15px}ol.path::before{left:16px}.card>button.head{padding:16px}.item{padding:14px 16px}}

.btn.play{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:14px 26px;font-size:18px;border-radius:999px;background:var(--stone);border-color:var(--stone);color:#fff}
.btn.play .ic{width:22px;height:22px;fill:currentColor}
#cine{position:fixed;inset:0;z-index:50;background:#0b0d0c;color:#fff;display:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#cine.open{display:block}
.sc{position:absolute;inset:0;opacity:0;transition:opacity .9s;pointer-events:none}
.sc.on{opacity:1}
.sc .bg{position:absolute;inset:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.3s}.sc .bg.on{opacity:1}
.sc .bg.kb{animation:kb var(--d,8s) ease-out forwards}
.paused .bg{animation-play-state:paused}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.12) translate(-1.5%,-1%)}}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.8),rgba(0,0,0,.4) 60%,rgba(0,0,0,.1)),linear-gradient(0deg,rgba(0,0,0,.7),transparent 40%)}
.sc .ghost{position:absolute;right:6%;top:10%;width:34vmin;height:34vmin;opacity:.1}
.sc .ghost .ic{width:100%;height:100%;stroke-width:.8}
.sc .in{position:absolute;z-index:2;left:max(6vw,24px);right:max(6vw,24px);top:0;bottom:130px;display:flex;flex-direction:column;justify-content:center;gap:26px;max-width:920px}
.sc .hd{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.sc h2{font-size:clamp(32px,6.5vw,72px);line-height:1.25}
.sc .kick,.sc .where{margin:0;font-size:clamp(16px,2.1vw,24px);opacity:.88}
.sc .tot{font-size:clamp(44px,9vw,104px);font-weight:700;line-height:1.1}
.num{display:inline-grid;place-items:center;width:clamp(44px,6vw,64px);aspect-ratio:1;border-radius:50%;font-weight:700;font-size:clamp(20px,3vw,30px);flex:none}
.sc ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.sc li{display:flex;gap:16px;align-items:center;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:14px 18px}
.sc li>div{flex:1;min-width:0}
.sc li b{font-size:clamp(18px,2.5vw,28px)}
.sc li p{margin:2px 0 0;font-size:clamp(14px,1.7vw,19px);opacity:.82}
.sc li .v{font-weight:700;font-size:clamp(18px,2.4vw,28px);white-space:nowrap}
.sc .ibox{background:rgba(255,255,255,.16);color:#fff}
.rv{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}
.rv.show{opacity:1;transform:none}
.ctl{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:0 max(4vw,16px) calc(16px + env(safe-area-inset-bottom,0px));transition:opacity .4s}
.idle .ctl{opacity:0}.idle{cursor:none}
.segs{display:flex;gap:6px;margin-bottom:12px}
.segs i{flex:1;height:5px;background:rgba(255,255,255,.28);border-radius:3px;overflow:hidden;cursor:pointer}
.segs b{display:block;height:100%;width:0;background:#fff}
.crow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.crow .sp{flex:1}
.cb{height:44px;min-width:44px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;font-size:14px}
.cb .ic{width:20px;height:20px}
@media (max-width:600px){.cb span{display:none}.sc .in{bottom:150px}}
@media (prefers-reduced-motion:reduce){.sc .bg{animation:none!important}}

.sc.draw .pen{position:absolute;z-index:2;right:max(3vw,16px);top:50%;transform:translateY(-54%);width:min(50vw,720px);aspect-ratio:520/440;filter:drop-shadow(0 20px 40px rgba(0,0,0,.5))}
.pen svg{width:100%;height:100%;display:block}
.pen .ln{fill:none;stroke:#2b2825;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.sc.on .pen .ln{animation:dr var(--t,.9s) steps(12) var(--w,0s) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.pen .wash{opacity:0}
.sc.on .pen .wash{animation:wsh 1.6s steps(8) 8.8s forwards}
@keyframes wsh{to{opacity:.5}}
.paused .pen *{animation-play-state:paused}
.sc.draw .in{max-width:min(460px,38vw)}
@media (max-width:700px){.sc.draw .pen{right:auto;left:50%;transform:translateX(-50%);top:max(8vh,64px);width:92vw}.sc.draw .in{max-width:none;justify-content:flex-end}}
@media (prefers-reduced-motion:reduce){.pen .ln{stroke-dashoffset:0!important;animation:none!important}.pen .wash{opacity:.38!important;animation:none!important}}
.sc .in{top:max(9vh,64px)}
.sc h2{font-size:clamp(22px,min(7vw,6.2vh),52px)}
.sc .tot{font-size:clamp(30px,min(10vw,9vh),56px)}
.sc .where{font-size:clamp(13px,min(3.6vw,2.8vh),20px)}
.sc li b{font-size:clamp(14px,min(4vw,2.6vh),19px)}
.sc li p{font-size:clamp(12px,min(3.3vw,2.2vh),15px)}
.sc li .v{font-size:clamp(14px,min(4vw,2.6vh),19px)}

.sc.cmp h2{font-size:clamp(20px,min(5.6vw,4.8vh),38px)}
.sc.cmp .tot{font-size:clamp(26px,min(8vw,7vh),44px)}
.sc.cmp .in,.sc.cmp .fit{gap:10px}.sc.cmp .hd{gap:6px}
.sc.cmp li{padding:8px 12px;gap:10px}.sc.cmp ul{gap:6px}
.sc.cmp li b{font-size:clamp(13px,min(3.6vw,2.3vh),17px)}.sc.cmp li p{font-size:clamp(11px,min(3vw,2vh),13px)}.sc.cmp li .v{font-size:clamp(13px,min(3.6vw,2.3vh),17px)}
.sc.cmp .ibox{width:30px;height:30px}
.sc.nd li p{display:none}
.sc.xs .hd .num,.sc.xs .where{display:none}
.sc.nw .where{display:none}
.sc .fit{display:flex;flex-direction:column;gap:inherit}
.sc.car ul{position:relative;overflow:hidden}
.sc.car li{position:absolute;left:0;right:0;top:0;opacity:0;transform:translateX(56px);transition:opacity .6s,transform .6s}
.sc.car li.show{opacity:1;transform:none}
.sc.car li.show.gone{opacity:0;transform:translateX(-56px)}
.dots{display:flex;gap:7px;justify-content:center;padding-top:2px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .4s}
.dots i.on{background:#fff;width:20px;border-radius:4px}

.pen .ln.g{stroke-opacity:.5}
.sc .in{justify-content:center;overflow:hidden}
.sc .fit{flex:none;width:100%}
.sc.draw .tot{white-space:nowrap}
.sc.draw .in{gap:16px}
.sc.on .pen .wash{animation-delay:8.4s}
@media (max-width:700px){
  .sc.draw .pen{opacity:.75;filter:none;top:max(3.5vh,28px);width:min(68vw,36vh)}
  .sc.draw .pen rect,.sc.draw .pen .wash{display:none}
  .sc.draw .pen .ln{stroke:#fff}
  .sc .in{top:max(4vh,28px);bottom:140px;gap:14px;justify-content:center;overflow:hidden}
  .sc.draw .in{justify-content:flex-end}
  .sc ul{gap:8px}.sc li{padding:10px 12px;gap:12px}
  .sc .ibox{width:34px;height:34px}
}
.sc .ul{width:min(300px,60%);height:12px;margin-top:-4px;filter:url(#rough)}
.sc .ul path,.sc .circ path{fill:none;stroke:#fff;stroke-linecap:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.sc .ul path{stroke-width:4}.sc .circ path{stroke-width:3;opacity:.85}
.ul.show path{animation:dr .9s steps(10) .3s forwards}
.sc .tot{position:relative;display:inline-block;padding:.02em .3em}
.sc .circ{position:absolute;left:-3%;top:-8%;width:106%;height:116%;overflow:visible;filter:url(#rough)}
.tot.show .circ path{animation:dr 1.3s steps(14) 1.2s forwards}
.sc .ic path{stroke-dasharray:1 1;stroke-dashoffset:1}
.sc .show .ic path{animation:dr 1.1s steps(10) .25s forwards}
.sc .ghost .ic path{stroke-dasharray:none;stroke-dashoffset:0}
.pen.light{opacity:.45}.pen.light .ln{stroke:#fff}
.sc.out .in{gap:14px}.sc.out li{padding:8px 14px}
.paused .ul path,.paused .circ path,.paused .ic path{animation-play-state:paused}
.lang{display:none!important}

/* pencil writing for key facts */
.pw{position:relative;display:inline-block}
.pw i{font-style:normal;display:inline-block;clip-path:inset(-30% 100% -30% 0)}
.pw::after{content:"\270E";position:absolute;left:0;bottom:-.2em;font-size:.55em;color:#f2c46b;opacity:0;pointer-events:none}
.rv.show .pw i{animation:pwr var(--pw,1.4s) steps(18) .25s forwards}
.rv.show .pw::after{animation:pwp var(--pw,1.4s) steps(18) .25s forwards}
@keyframes pwr{to{clip-path:inset(-30% 0 -30% 0)}}
@keyframes pwp{0%{left:0;opacity:1}92%{opacity:1}100%{left:100%;opacity:0}}
.paused .pw i,.paused .pw::after{animation-play-state:paused}
.hl{color:#ffd27a}
@media (prefers-reduced-motion:reduce){.pw i{clip-path:none!important;animation:none!important}.pw::after{display:none}}
/* beats: one thought at a time, sliding left as the next arrives */
.beats{display:grid;position:relative}
.bt{grid-area:1/1;display:flex;flex-direction:column;gap:14px;align-items:flex-start;opacity:0;transform:translateX(56px);transition:opacity .6s,transform .6s;pointer-events:none}
.bt.show{opacity:1;transform:none}
.bt.show.gone{opacity:0;transform:translateX(-56px)}
.bt h3{margin:0;font-size:clamp(22px,min(6.6vw,5.8vh),48px);line-height:1.3}
.bt .kick{margin:0;font-size:clamp(14px,min(4vw,3vh),22px);opacity:.85;letter-spacing:.04em}
.bt .cap,.sc .note{margin:0;font-size:clamp(14px,min(4.2vw,3vh),24px);line-height:1.45;opacity:.94}
.bt .big,.big2{margin:0;font-weight:700;line-height:1.2;color:#fff}
.bt .big{font-size:clamp(30px,min(10vw,8.6vh),76px)}
.bt .yr{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap}
.bt .yr .big{font-size:clamp(40px,min(13vw,11vh),96px)}
.bt .chips{display:flex;gap:8px 10px;flex-wrap:wrap}
.bt .chip{display:inline-block;padding:7px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.1);font-size:clamp(14px,min(4.2vw,3.1vh),24px)}
.bt .tot{font-size:clamp(34px,min(11vw,9.5vh),72px)}
.bdots{display:flex;gap:7px;padding-top:4px}
.bdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .4s}
.bdots i.on{background:#fff;width:20px;border-radius:4px}
.sc .pl{display:grid;gap:12px}
.big2{font-size:clamp(24px,min(8vw,6.4vh),52px)}.big2.fin{font-size:clamp(18px,min(5.4vw,4.4vh),34px);font-weight:600}
.sc .pts{display:grid;gap:4px;margin-top:4px}
.sc .pt{font-size:clamp(13px,min(3.8vw,2.7vh),19px);opacity:.95}
.sc .pt::before{content:"\2013  ";opacity:.6}
.sc.intro .in,.sc.end .in{max-width:min(540px,44vw)}
@media (max-width:700px){.sc.intro .in,.sc.end .in{max-width:none}}
.sc.cmp .bt{gap:8px}.sc.cmp .bt h3{font-size:clamp(19px,min(5.4vw,4.4vh),34px)}
.sc.cmp .bt .big{font-size:clamp(26px,min(8.4vw,6.8vh),52px)}.sc.cmp .bt .yr .big{font-size:clamp(32px,min(10vw,8vh),64px)}
.sc.cmp .bt .cap,.sc.cmp .note{font-size:clamp(12px,min(3.5vw,2.5vh),19px)}
.sc.cmp .bt .chip{padding:5px 11px;font-size:clamp(12px,min(3.5vw,2.5vh),19px)}
.sc.cmp .bt .tot{font-size:clamp(28px,min(9vw,7.4vh),52px)}
.sc.cmp .big2{font-size:clamp(20px,min(6.4vw,5vh),38px)}.sc.cmp .big2.fin{font-size:clamp(15px,min(4.4vw,3.6vh),26px)}
.sc.cmp .pl{gap:8px}
.sc.xs .bt .kick{display:none}
.sc.xs .ibox{display:none}.sc.xs li{padding:6px 10px;gap:8px}.sc.xs .pts{display:grid;gap:0;margin-top:2px}.sc.xs .pt{grid-area:1/1;font-size:13px;transition:opacity .5s,transform .5s}.sc.xs .pt.show.gone{opacity:0;transform:translateX(-30px)}.sc.xs h2{font-size:clamp(16px,4.6vh,28px)}.sc.xs .tot{font-size:clamp(22px,7vh,40px)}.sc.xs .hd{gap:4px}.sc.xs .fit{gap:6px}
/* start gate (needed because phones only allow sound after a tap) */
#gate{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(8,10,9,.5),rgba(8,10,9,.88));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);cursor:pointer;text-align:center;padding:24px}
#gate.on{display:flex}
.gbox{display:grid;gap:14px;justify-items:center}
.gt{font-size:clamp(22px,6vw,40px);font-weight:700;line-height:1.3}
.gs{font-size:clamp(16px,4vw,24px);opacity:.9}
.gplay{width:clamp(84px,22vw,120px);aspect-ratio:1;border-radius:50%;border:2px solid #fff;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;animation:gp 1.8s ease-in-out infinite}
.gplay svg{width:46%;fill:#fff;margin-left:6%}
.gh{font-size:clamp(15px,3.8vw,20px);opacity:.92}
@keyframes gp{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.4)}50%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(255,255,255,0)}}

/* ===== v2: text zone | media zone (no overlap), slower reveals ===== */
#cine{--ctl:96px}
.sc{transition:opacity 1.2s ease}
.sc::after,.sc .ghost{display:none}
.sc .media{position:absolute;z-index:1;overflow:hidden;border-radius:18px;border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 50px rgba(0,0,0,.45);left:max(4vw,16px);right:max(4vw,16px);top:calc(max(2.5vh,16px) + env(safe-area-inset-top,0px));height:min(34vh,80vw)}
.sc .media.paper{background:#f4eddc}
.sc .media.lite{border-color:transparent;box-shadow:none}
.media .pen{position:absolute;inset:0;transition:opacity 1.4s ease}
.media .pen svg{width:100%;height:100%;display:block}
.media.ph .pen{inset:auto 12px 12px auto;width:30%;height:auto;aspect-ratio:520/440;z-index:3;border-radius:8px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.5);animation:pop 1s ease .9s both}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.ded{margin-top:8px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2);font-size:clamp(12px,min(3.2vw,2.3vh),16px);letter-spacing:.02em;color:rgba(255,255,255,.62)}
.sc .media .bg{position:absolute;inset:0;background:none;opacity:0;transition:opacity 1.6s ease}
.sc .media .bg::before,.sc .media .bg::after{content:"";position:absolute;inset:0;background:var(--u) center/cover no-repeat}
.sc .media .bg::after{background-size:contain}
.sc .media .bg.on{opacity:1}
.sc .media .bg::before{inset:-12%;filter:blur(22px) brightness(.5)}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
.sc .in{left:max(5vw,18px);right:max(5vw,18px);width:auto;max-width:none;top:calc(max(2.5vh,16px) + min(34vh,80vw) + 16px + env(safe-area-inset-top,0px));bottom:calc(var(--ctl) + 8px);gap:16px;justify-content:center;overflow:hidden}
.sc.intro .in,.sc.end .in{max-width:none}
.sc .tot{white-space:nowrap}
.rv{transition:opacity 1s ease,transform 1s ease}
.bt{transition:opacity .9s ease,transform .9s ease}
@media (min-aspect-ratio:6/5) and (min-width:701px){
 .sc .media{left:auto;right:max(3vw,20px);width:50vw;top:max(5vh,24px);height:auto;bottom:calc(var(--ctl) + 12px)}
 .sc .in{left:max(4vw,24px);right:auto;width:41vw;top:max(5vh,24px);bottom:calc(var(--ctl) + 12px)}
}

<body data-lang="ml">
<header class="bar"><div class="wrap">
  <span class="brand" id="brand"></span>

</div></header>

</main>

document.addEventListener('click',function(e){

var TRP=["ഓം ശ്രീ സുബ്രഹ്മണ്യായ നമഃ. ഭാരതത്തിലെ പ്രമുഖ സുബ്രഹ്മണ്യ ക്ഷേത്രങ്ങളിൽ ഒന്നാണ് പയ്യന്നൂർ ശ്രീ സുബ്രഹ്മണ്യ സ്വാമി ക്ഷേത്രം. പരശുരാമൻ പ്രതിഷ്ഠിച്ച ഈ ക്ഷേത്രം, 1789-ൽ ടിപ്പുവിന്റെ പടയോട്ടക്കാലത്ത് നശിപ്പിക്കപ്പെട്ടിരുന്നു. മൂന്നു വർഷത്തിന് ശേഷം താഴക്കാട്ട് മനയുടെയും നാട്ടുപ്രമാണിമാരുടെയും നേതൃത്വത്തിൽ പുനരുദ്ധീകരണം തുടങ്ങി. 1838-ൽ ഈ പ്രവൃത്തികൾ പൂർത്തിയായി. ഇന്ന് കാണുന്ന ക്ഷേത്രത്തിന്റെ ഒട്ടുമിക്ക ഭാഗങ്ങളും അക്കാലത്ത് നിർമ്മിക്കപ്പെട്ടതാണ്. പിന്നീടുള്ള കാലങ്ങളിൽ ക്ഷേത്രത്തിൽ നിരവധി അറ്റകുറ്റപ്പണികളും നവനിർമ്മിതികളും നടന്നിട്ടുണ്ട്. കാലപ്പഴക്കവും കാലാവസ്ഥയും ഭക്തജനത്തിരക്കും മൂലം സമഗ്രമായ നവീകരണം ഇപ്പോൾ അനിവാര്യമാണ്. സാധാരണയായി ക്ഷേത്രത്തിന്റെ ഓരോ ഭാഗത്തായി ഒതുങ്ങിനിന്ന അറ്റകുറ്റപ്പണികൾക്ക് പകരം, ക്ഷേത്രത്തെയും പരിസരത്തെയും ഒരു ഏകീകൃത വ്യവസ്ഥയായി കണ്ടാണ് ഈ പദ്ധതി രൂപകൽപ്പന ചെയ്തിരിക്കുന്നത്. ഭാരതത്തിന്റെ യശസ്സ് വാനോളം ഉയർത്തിയ നിരവധി മഹാരഥന്മാരുടെ നാടാണ് പയ്യന്നൂർ. സ്വാതന്ത്ര്യസമരകാലത്ത് സ്തുത്യർഹമായ പങ്കുവഹിച്ച പയ്യന്നൂർ, രണ്ടാം ബർദോളി എന്നും അറിയപ്പെടുന്നു. ഭാരതത്തിന്റെ ടൂറിസം ഭൂപടത്തിൽ പ്രധാന തീർത്ഥാടന കേന്ദ്രമായി വളരാനുള്ള ഉൾക്കരുത്ത് ഈ ക്ഷേത്രത്തിനുണ്ട്. ആ സ്വപ്നം യാഥാർത്ഥ്യമാക്കാനുള്ള ചുവടുവയ്പാണ് ഈ പുനരുദ്ധാരണ പദ്ധതി. ക്ഷേത്രദർശനം തുടങ്ങുന്നത് ക്ഷേത്രക്കുളമായ ചിറയിൽ കുളിച്ചുകൊണ്ടാണല്ലോ. ചിറയിൽ തുടങ്ങി ശ്രീകോവിലിലേക്കും പുറത്തെ ഭാഗങ്ങളിലേക്കും നീളുന്ന ഈ പദ്ധതിയിൽ, ഗോപുരത്തിന്റെ ആറ് കോടി രൂപ ഉൾപ്പെടെ ഒൻപത് പ്രവൃത്തികൾക്കായി ഏകദേശം പതിനഞ്ച് കോടി രൂപയാണ് കണക്കാക്കുന്നത്. ഇവയെല്ലാം പ്രാഥമിക ഏകദേശ കണക്കുകളാണ്.", "ആദ്യം ചിറയുടെ നവീകരണം. ഏകദേശം ഒന്നരക്കോടി രൂപയാണ് ചെലവ് പ്രതീക്ഷിക്കുന്നത്. സമഗ്ര നവീകരണത്തിലൂടെ ഭക്തജനങ്ങൾക്ക് കൂടുതൽ സൗകര്യവും സുരക്ഷയും, ഒപ്പം ചിറയുടെ സൗന്ദര്യം ആസ്വദിക്കാനുള്ള ഇടവും ഒരുക്കാനാണ് ലക്ഷ്യമിടുന്നത്.", "അടുത്തത് ചിറ മുതൽ ക്ഷേത്രം വരെയുള്ള ഭാഗമാണ്. ക്ഷേത്രം മുതൽ ചിറ വരെയുള്ള സ്ഥലം മുഴുവൻ ഇന്റർലോക്ക് ടൈലുകൾ ഇട്ട നടപ്പാതയാണ് വിഭാവനം ചെയ്യുന്നത്. അതിനടുത്ത് ഒരു കോടി രൂപ ചെലവ് വരുന്ന ഒരു ഉദ്യാനവും പദ്ധതിയിലുണ്ട്. ഹരിതാഭമായ പാത എന്നതിലുപരി, ക്ഷേത്രത്തിന് പുറത്ത് അല്പനേരം വിശ്രമിക്കാനും ഈ ഉദ്യാനം സഹായിക്കും. ഇതോടൊപ്പം, നിലവിലുള്ള മണ്ഡപം പൊളിച്ചുനീക്കി ചിറ വരെ മുന്നൂറ് മീറ്റർ നടപ്പന്തൽ നിർമ്മിക്കാൻ ഒരു കോടി രൂപയും കണക്കാക്കുന്നു.", "അടുത്തത് വളരെ പ്രധാനപ്പെട്ട ഭാഗമാണ്. മതിലിനകത്തേക്കുള്ള പ്രവേശന ഗോപുരം. ഏകദേശം ആറ് കോടി രൂപ ചെലവ് പ്രതീക്ഷിക്കുന്ന ഈ നിർമ്മിതി, ക്ഷേത്രത്തിന്റെ വാസ്തുവിദ്യയുമായി ഇണങ്ങുന്നതായിരിക്കും. ഉള്ളിൽ അഞ്ച് മുതൽ ആറ് വരെ മുറികളും, സാധ്യമെങ്കിൽ സുബ്രഹ്മണ്യ സ്വാമിയുടെ വലിയൊരു രൂപവും വിഭാവനം ചെയ്യുന്നു.", "ഇനിയുള്ളത് ക്ഷേത്രത്തിനുള്ളിലെ പ്രധാന പ്രവൃത്തികളാണ്; ആകെ ചെലവ് അഞ്ച് കോടി രൂപ. ചുറ്റമ്പലത്തിന് ചെമ്പ് അടിക്കാൻ മൂന്ന് കോടി രൂപയും, ക്ഷേത്രത്തിനുള്ളിൽ ഭക്ഷണശാലയും അനുബന്ധ സാമഗ്രികളും ഒരുക്കാൻ ഒരു കോടി രൂപയും കണക്കാക്കുന്നു. കലാപരിപാടികളുടെ അരങ്ങേറ്റത്തിനായി സ്റ്റേജും അനുബന്ധ സൗകര്യങ്ങളും ഒരുക്കാൻ ഒരു കോടി രൂപയും വകയിരുത്തിയിട്ടുണ്ട്.", "തുടർന്ന് പുറത്തെ ഭാഗങ്ങളിലെ നവീകരണങ്ങളാണ്; ആകെ തുക ഒരു കോടി രൂപ. ക്ഷേത്രത്തിന് തെക്ക് ഭാഗത്തെ സ്റ്റേജും ഗ്രൗണ്ടും നവീകരിക്കാൻ എഴുപത്തഞ്ച് ലക്ഷം രൂപയും, നിലവിലുള്ള അരയാൽത്തറ വെട്ടിച്ചുരുക്കി വാഹന പാർക്കിംഗ് ഉൾപ്പെടെ തുറസ്സായ പടിഞ്ഞാറെ നട ഒരുക്കാൻ ഇരുപത്തഞ്ച് ലക്ഷം രൂപയും കണക്കാക്കുന്നു.", "പയ്യന്നൂർ ശ്രീ സുബ്രഹ്മണ്യ സ്വാമി ക്ഷേത്ര നവീകരണ പദ്ധതിയിലെ ഒൻപത് പ്രവൃത്തികളുടെ ആകെ ഏകദേശ തുക പതിനഞ്ച് കോടി രൂപയാണ്. ഇത് അന്തിമ എസ്റ്റിമേറ്റ് അല്ല, ഫീൽഡ് നോട്ടുകളെ അടിസ്ഥാനമാക്കിയുള്ള ഏകദേശ കണക്ക് മാത്രമാണ്.", "ബൃഹത്തായ ഈ പദ്ധതിയിൽ പയ്യന്നൂർക്കാരുടെയും സർക്കാരിന്റെയും ലോകമെമ്പാടുമുള്ള ഭക്തജനങ്ങളുടെയും സഹായസഹകരണങ്ങൾ പ്രതീക്ഷിക്കുന്നു. പെരുമാളുടെ കൃപകൊണ്ട് ഈ പ്രവൃത്തികൾ വിജയകരമായി പൂർണ്ണതയിലെത്തുമെന്ന് പ്രത്യാശിക്കുന്നു."];
